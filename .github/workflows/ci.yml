name: CI/CD - Calidad y Despliegue Dinámico

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['main', 'development']

jobs:
  # TAREA 1: Verificación (Debe correr siempre)
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      # Si esto falla, es porque falta package-lock.json en el repo
      - name: Instalar dependencias
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Tests Unitarios
        run: npm run test -- --run

      - name: Build
        run: npm run build

  # TAREA 2: Despliegue (Solo corre si la anterior pasa)
  deploy:
    needs: build-and-test
    runs-on: ubuntu-latest

    permissions:
      contents: read # Para poder hacer checkout del código
      pull-requests: write # Para poder comentar en el PR
      issues: write # A veces necesario dependiendo de cómo GitHub trate el comentario
    # Solo despliega en PRs o en ramas main/development
    if: |
      github.event_name == 'pull_request' ||
      (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/development'))
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Instalar Vercel CLI
        run: npm install --global vercel@latest

      - name: Desplegar a Vercel
        id: vercel_action # IMPORTANTE: ID necesario para pasar la URL al siguiente paso
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          # 1. Detectar entorno
          if [[ "${{ github.ref }}" == "refs/heads/main" && "${{ github.event_name }}" == "push" ]]; then
            VERCEL_ENV="production"
            VERCEL_ARGS="--prod"
          else
            VERCEL_ENV="preview"
            VERCEL_ARGS="" 
          fi

          # 2. Pull y Build
          vercel pull --yes --environment=$VERCEL_ENV --token=$VERCEL_TOKEN
          vercel build $VERCEL_ARGS --token=$VERCEL_TOKEN

          # 3. Desplegar y CAPTURAR la URL
          # Guardamos la salida del comando en una variable
          DEPLOY_URL=$(vercel deploy --prebuilt $VERCEL_ARGS --token=$VERCEL_TOKEN)

          # 4. EXPORTAR URL (Para que el paso del comentario la pueda leer)
          echo "url=$DEPLOY_URL" >> $GITHUB_OUTPUT

          # 5. GENERAR RESUMEN VISUAL EN GITHUB (Visible en los detalles del Run)
          echo "### 🚀 Despliegue en Vercel Exitoso" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY # Salto de línea
          echo "| Entorno | URL |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          echo "| **$VERCEL_ENV** | [Visitar Sitio 🔗]($DEPLOY_URL) |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> _El despliegue se ha completado correctamente._" >> $GITHUB_STEP_SUMMARY

      - name: Comentar Link en el PR
        uses: actions/github-script@v6
        if: github.event_name == 'pull_request'
        with:
          script: |
            const url = '${{ steps.vercel_action.outputs.url }}';
            const body = `### 🚀 Preview Disponible

            | Entorno | Estado | Link |
            | :--- | :--- | :--- |
            | **Preview** | ✅ Listo | **[Visitar Sitio](${url})** |

            > _Desplegado automáticamente por GitHub Actions._`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            })
