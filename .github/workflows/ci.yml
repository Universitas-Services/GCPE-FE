name: CI/CD - Calidad y Despliegue Dinámico

on:
  push:
    branches: ['**']
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main, development]

jobs:
  build-and-test:
    name: Verificar Código (CI)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      # IMPORTANTE: Esto requiere que package-lock.json esté en el repo
      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar Lint
        run: npm run lint

      - name: Ejecutar Tests Unitarios
        run: npm run test -- --run

      - name: Verificar Build
        run: npm run build

      - name: Instalar Playwright
        run: npx playwright install --with-deps

      - name: Ejecutar Tests E2E
        run: npm run test:e2e

  deploy:
    name: Desplegar a Vercel
    needs: build-and-test
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'pull_request' ||
      (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/development'))
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Instalar Vercel CLI
        run: npm install --global vercel@latest

      - name: Ejecutar Despliegue
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/main" && "${{ github.event_name }}" == "push" ]]; then
            echo "🚀 MODO: PRODUCCIÓN"
            VERCEL_ENV="production"
            VERCEL_ARGS="--prod"
          else
            echo "🔎 MODO: PREVIEW"
            VERCEL_ENV="preview"
            VERCEL_ARGS="" 
          fi

          vercel pull --yes --environment=$VERCEL_ENV --token=$VERCEL_TOKEN
          vercel build $VERCEL_ARGS --token=$VERCEL_TOKEN
          vercel deploy --prebuilt $VERCEL_ARGS --token=$VERCEL_TOKEN
